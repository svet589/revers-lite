services:
  - type: web
    name: revers-lite-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: revers-postgres
          property: connectionString

databases:
  - name: revers-postgres
    plan: free
    ipAllowList: []  # Разрешить всем
