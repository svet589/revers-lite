version: '3.8'

services:
  revers-server:
    build: .
    container_name: revers-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/revers.db
    volumes:
      - revers-data:/app/data

volumes:
  revers-data:
